name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Log in to Docker Hub using repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      # 3. Build and push Docker image
      - name: Set Docker tag
        id: tag
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=develop" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ftambler/ffmpeg-gui:${{ github.sha }}
            ftambler/ffmpeg-gui:${{ steps.tag.outputs.TAG }}

      # 4. Optional: display image digest
      - name: Show pushed image digest
        run: docker inspect --format='{{index .RepoDigests 0}}' ftambler/ffmpeg-gui:${{ steps.tag.outputs.TAG }}